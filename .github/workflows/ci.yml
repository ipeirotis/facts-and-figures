name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fixture-check:
    name: deterministic fixture check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: run the fixture self-check (no LLM)
        run: python3 evals/check_fixture.py
      - name: run the grader self-tests (no LLM)
        run: python3 evals/test_graders.py
      - name: run the write-boundary hook self-tests (no LLM)
        run: python3 evals/test_hook.py
      - name: check for dangling reference citations
        run: |
          grep -rhoE 'references/[a-z0-9-]+\.md' -- SKILL.md README.md AGENTS.md references/ \
            | sort -u | while read -r p; do
              [ -f "$p" ] || { echo "MISSING: $p"; exit 1; }
            done
      - name: check version consistency
        run: |
          # the authoritative fields, not an arbitrary occurrence: the
          # SKILL.md check reads only the frontmatter block, and
          # plugin.json is parsed as JSON
          v="$(cat VERSION)"
          awk '/^---$/{n++; next} n==1' SKILL.md \
            | grep -qE "^[[:space:]]*version: \"$v\"[[:space:]]*$" \
            || { echo "SKILL.md frontmatter version != VERSION ($v)"; exit 1; }
          python3 -c "import json,sys; sys.exit(0 if json.load(open('.claude-plugin/plugin.json'))['version'] == open('VERSION').read().strip() else 1)" \
            || { echo "plugin.json version != VERSION ($v)"; exit 1; }

  plugin-validate:
    name: validate plugin manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate . --strict
